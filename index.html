<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reigebait Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Karla:wght@400;700&amp;display=swap">
<style>
:root{
  --bg:#f6e2e9;--paper:#fefaf3;--text:#233324;--line:#233324;
  --ink:#233324;--red:#4f6e4e;--sun:#84a282;--pink:#fefaf3;--lime:#b8cfb3;--sky:#f6e2e9;
  --head:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Karla","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2a1f;--paper:#2a392c;--text:#fefaf3;--line:#fefaf3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2a1f;--paper:#2a392c;--text:#fefaf3;--line:#fefaf3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:30px/1 var(--head)}
.logo img{width:auto;height:56px;transition:transform .2s}
.logo:hover img{transform:rotate(-8deg) scale(1.1)}
nav a{font-weight:700;text-decoration:none;border:3px solid var(--line);background:var(--paper);padding:6px 14px;border-radius:99px;margin-left:6px}
.hero{position:relative;padding:18px 0 10px}
h1{font:clamp(44px,11vw,92px)/.95 var(--head);margin:0 0 14px;max-width:11ch;transform:rotate(-2deg);animation:wob .6s ease-out}
@keyframes wob{0%{transform:rotate(4deg) scale(.9)}60%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(-2deg)}}
.hero p{max-width:34em;font-size:20px;margin:0 0 16px}
.hero .steam{position:absolute;right:0;top:0;width:min(34vw,200px);transform:rotate(8deg)}
.sticker{display:inline-block;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:700;transform:rotate(1.5deg);box-shadow:5px 5px 0 var(--ink)}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:34px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--c);color:var(--ink);border:4px solid var(--ink);border-radius:22px 8px 22px 8px;padding:20px;text-decoration:none;box-shadow:7px 7px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.card:nth-child(even){transform:rotate(1deg);border-radius:8px 22px 8px 22px}
.card:nth-child(odd){transform:rotate(-1deg)}
.card:hover{transform:rotate(0) translate(-3px,-3px);box-shadow:11px 11px 0 var(--ink)}
.tag{align-self:flex-start;background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;font-size:15px;font-weight:700}
.card h2{font:26px/1.1 var(--head);margin:0}
.card p{margin:0;flex:1}
.mini{font-weight:700;font-size:16px}
article{background:var(--paper);border:4px solid var(--line);border-radius:26px 10px 26px 10px;box-shadow:8px 8px 0 var(--line);padding:clamp(18px,4vw,40px);margin-top:10px}
article h1{font-size:clamp(34px,7vw,58px);max-width:none;transform:none;animation:none;margin:10px 0 18px}
article p{max-width:38em}
.back{font-weight:700}
.counter{background:var(--sky);color:var(--ink);border:3px dashed var(--ink);border-radius:14px;padding:14px 16px;margin:24px 0;max-width:38em}
.counter b{font-family:var(--head);font-weight:400;font-size:20px}
.meter{background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:20px;padding:20px;margin-top:28px}
.meter h3{font:28px/1.1 var(--head);margin:0 0 4px}
.meter p{margin:0 0 14px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.faces button{font:inherit;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
.faces button span{font-size:30px;line-height:1.1}
.faces button:hover{transform:translateY(-3px)}
.faces button{background:#fefaf3}
.faces button[aria-pressed="true"]{background:var(--sun);transform:scale(1.08)}
.bars{margin-top:16px;display:grid;gap:6px;color:#fff}
.bar{display:grid;grid-template-columns:88px 1fr 28px;align-items:center;gap:8px;font-size:14px;font-weight:700}
.bar i{display:block;height:14px;background:rgba(0,0,0,.3);border-radius:9px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--sun);border-radius:9px;transition:width .4s}
.score{margin-top:12px;font-weight:700}
.foot{margin-top:50px;font-size:15px;max-width:42em}
.foot strong{background:var(--sun);color:var(--ink);padding:0 6px;border-radius:4px}
@media (max-width:520px){.faces button{font-size:11px}.faces button span{font-size:24px}.bar{grid-template-columns:70px 1fr 24px}}
.admin{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
.admin button,.form button{font:inherit;font-weight:700;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.form label{display:block;font-weight:700;margin:16px 0 4px}
.form input,.form textarea,.form select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:3px solid var(--line);border-radius:10px;padding:10px}
.form textarea{min-height:170px}
.note{font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <script type="application/json" id="data">[{"id":"lol","tag":"School","c":"var(--pink)","title":"Lol","teaser":"love eating","body":["sjchjvsdoujvo bdobvuojdscj jdsovbujdbvosbdovbuoovbcjjnk jcnknjsbvoodjbvojbvjjcvj lmjcjujjjjjcjdojjcxnsouhvdbcnkn j","And vckkjcbjnsodiovnoj"],"counter":"ayd"},{"id":"family-roots","tag":"Family","c":"var(--pink)","title":"In reality, the Family tree means nothing","teaser":"Why preserving family roots might matter far less than we pretend.","body":["You share DNA with a person who lived in 1700 and you would not recognize each other’s values, jokes, or table manners. Yet we frame their names as sacred.","Most of us can’t name a great-great-grandparent’s favorite food, hopes, or fears. A name and a date is not a relationship. It is a label we hang on the past to feel important.","Energy spent on genealogy could go to people who are alive: calling a grandparent, helping a cousin, building something your descendants will actually inherit."]},{"id":"follow-passion","tag":"Career","c":"var(--lime)","title":"“Follow your passion” is terrible advice","teaser":"Passion usually comes after you get good at something, not before.","body":["Nobody is born with a burning love for accounting, dentistry, or logistics. Yet people are great at all three and happy doing them.","Passion is often the reward for skill, not the starting gun. You enjoy things more once you are competent, respected, and paid for them.","Telling teenagers to wait for a magical feeling is how people spend years frozen, waiting for a spark that a boring first job would have lit."],"counter":"Interest does help people stick with hard work, and plenty of people build great careers from something they loved early on."},{"id":"punctuality","tag":"Habits","c":"var(--sky)","title":"Being on time is just bossing people around politely","teaser":"Who decided that 9:00 sharp is morally better than 9:12?","body":["Clocks are a made-up agreement, and lateness is treated like a character flaw. Someone with a gentle, flexible pace is called rude, while the person who sends a stiff reminder email is called professional.","Time is a tool. If a gathering works fine when people trickle in, the rule of arriving exactly on the minute is doing nothing but exercising power.","Maybe the fair rule is this: be on time when it helps people, and relax when it only helps the schedule feel strict."],"counter":"Showing up on time signals respect, because other people’s time is just as valuable as yours. Shared plans only work when someone can rely on them."},{"id":"more-books","tag":"Learning","c":"var(--sun)","title":"Reading more books won’t make you smarter","teaser":"Counting books is a hobby, not an education.","body":["A reading challenge of 100 books a year sounds impressive until you ask what changed in the reader. Many finish a book, forget it, and start the next to keep the number growing.","Understanding comes from using ideas: arguing, building, teaching, and failing. One book chewed on for a month can beat twenty skimmed on a commute.","Bragging about volume turns learning into a scoreboard. Read less, do more with it."],"counter":"Wide reading exposes you to ideas you would never find alone, and readers often build vocabulary and empathy over time."}]</script>

var SEED=[
{id:"family-roots",tag:"Family",c:"var(--pink)",title:"Your family tree is just a list of strangers",
 teaser:"Why preserving family roots might matter far less than we pretend.",
 body:["You share DNA with a person who lived in 1700 and you would not recognize each other’s values, jokes, or table manners. Yet we frame their names as sacred.","Most of us can’t name a great-great-grandparent’s favorite food, hopes, or fears. A name and a date is not a relationship. It is a label we hang on the past to feel important.","Energy spent on genealogy could go to people who are alive: calling a grandparent, helping a cousin, building something your descendants will actually inherit."],
 counter:"Family history can explain inherited health risks, migration stories, and why a family holds the values it does. Roots can be a source of identity and comfort."},
{id:"follow-passion",tag:"Career",c:"var(--lime)",title:"“Follow your passion” is terrible advice",
 teaser:"Passion usually comes after you get good at something, not before.",
 body:["Nobody is born with a burning love for accounting, dentistry, or logistics. Yet people are great at all three and happy doing them.","Passion is often the reward for skill, not the starting gun. You enjoy things more once you are competent, respected, and paid for them.","Telling teenagers to wait for a magical feeling is how people spend years frozen, waiting for a spark that a boring first job would have lit."],
 counter:"Interest does help people stick with hard work, and plenty of people build great careers from something they loved early on."},
{id:"punctuality",tag:"Habits",c:"var(--sky)",title:"Being on time is just bossing people around politely",
 teaser:"Who decided that 9:00 sharp is morally better than 9:12?",
 body:["Clocks are a made-up agreement, and lateness is treated like a character flaw. Someone with a gentle, flexible pace is called rude, while the person who sends a stiff reminder email is called professional.","Time is a tool. If a gathering works fine when people trickle in, the rule of arriving exactly on the minute is doing nothing but exercising power.","Maybe the fair rule is this: be on time when it helps people, and relax when it only helps the schedule feel strict."],
 counter:"Showing up on time signals respect, because other people’s time is just as valuable as yours. Shared plans only work when someone can rely on them."},
{id:"more-books",tag:"Learning",c:"var(--sun)",title:"Reading more books won’t make you smarter",
 teaser:"Counting books is a hobby, not an education.",
 body:["A reading challenge of 100 books a year sounds impressive until you ask what changed in the reader. Many finish a book, forget it, and start the next to keep the number growing.","Understanding comes from using ideas: arguing, building, teaching, and failing. One book chewed on for a month can beat twenty skimmed on a commute.","Bragging about volume turns learning into a scoreboard. Read less, do more with it."],
 counter:"Wide reading exposes you to ideas you would never find alone, and readers often build vocabulary and empathy over time."}
];

  var d=load(),c=counts(d,id).slice(),old=d.mine[id];
  if(old===i)return;
  if(old!==undefined)c[old]=Math.max(0,c[old]-1);
  c[i]++;d.mine[id]=i;

}

function about(){
  return '<article><h1>About Reigebait</h1><p>Reigebait Blog challenges ideas that Rei wants to question. Each article takes a popular belief that most people accept without a second thought and argues the opposite as sharply as it can. The point isn’t to be right or to be liked. It’s to show that almost every idea people call “common sense” has another side, and that looking at that side can be uncomfortable, funny, annoying, and surprisingly useful all at once. After each article, you can use the rage meter to vote on how mad it made you.</p><p>The goal is simple: make you react, then make you think. The takes are exercises in perspective, not statements of personal belief. It is made to be thought-provoking.</p></article>'+
  '<article style="margin-top:28px"><h2 style="font:clamp(28px,6vw,42px)/1.1 var(--head);margin:10px 0 18px">Who is the website’s author?</h2>'+
  '<p>Hi, I’m Rei, I’m 14 years old, and I’m tired of conventions.</p>'+
  '<p>I lived in three countries completely different from each other with traditional values and mentalities.</p>'+
  '<p>First, I was born in Russia deep in the north of Siberia. There, -58 °F was just a part of my normal life, serious people on the streets and nostalgia of being a kid.</p>'+
  '<p>When I was 10, my family and I moved to Kazakhstan, the south capital - Almaty. I learned Kazakh, went to an international school, and got introduced to Muslim traditions. But I lived there only for 3 years, and when I was almost 13, we moved again. But this time, I had to deal with more challenges, like improving my English, learning people’s opinions that differ with Russian and Kazakh mentalities and adapting to school.</p>'+
  '<p>This crazy experience of having 3 different mentalities, opinions and values in my mind made me realize that so many people in our society can’t even imagine having more than one perspective on something. Therefore, the main goal of my website is to challenge society’s conventions and ideas!</p></article>';
}
